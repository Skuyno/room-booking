services:
  db:
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booking -d booking" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: booking-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_PORT: "${HTTP_PORT:-8080}"
      DB_DSN: "${DB_DSN:-postgres://booking:booking@db:5432/booking?sslmode=disable}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}"
    ports:
      - "8080:8080"

volumes:
  pg_data:
